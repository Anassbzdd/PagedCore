[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedcore"
version = "0.1.0"
description = "A learning-focused paged KV-cache inference engine for one NVIDIA T4"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["inference", "llm", "paged-attention", "pytorch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "torch",
    "transformers",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "build",
    "httpx",
    "hypothesis",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
pagedcore = "pagedcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/pagedcore"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "benchmark: benchmark-harness tests excluded from routine CPU checks",
    "gpu: tests that require an NVIDIA T4 and CUDA runtime",
    "integration: cross-component tests",
    "service: HTTP and SSE service tests",
]
